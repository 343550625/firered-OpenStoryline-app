name: Build FireRed APP & EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android Project
        run: |
          cordova create app com.firered.app "FireRed"
          cd app
          cordova platform add android

      - name: Create HTML Page
        run: |
          rm -rf app/www/*
          cat > app/www/index.html << ENDHTML
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>FireRed</title>
          <style>
          body{margin:0;padding:0;font-family:sans-serif;background:#1a1a2e;color:white}
          .hdr{background:linear-gradient(135deg,#16213e,#0f3460);padding:20px;text-align:center}
          .c{padding:20px}
          .b{display:block;background:#e94560;color:white;padding:15px;border-radius:8px;text-align:center;text-decoration:none;font-weight:bold;margin-top:10px}
          </style>
          </head>
          <body>
          <div class="hdr"><h1>FireRed OpenStoryline</h1><p>AI视频编辑工具</p></div>
          <div class="c">
          <p>Apache 2.0开源协议 - 可免费商用</p>
          <a class="b" href="https://github.com/FireRedTeam/FireRed-OpenStoryline">查看源码</a>
          </div>
          </body>
          </html>
          ENDHTML

      - name: Build APK
        run: |
          cd app
          cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: firered-android-apk
          path: app/platforms/android/app/build/outputs/apk/release/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Electron Project
        run: |
          mkdir electron-app
          cd electron-app
          npm init -y
          npm install electron@28.0.0 --save-dev

      - name: Create Electron Files
        run: |
          $mainjs = @"
          const { app, BrowserWindow } = require('electron');
          function createWindow() {
            const win = new BrowserWindow({ width: 1200, height: 800, title: 'FireRed' });
            win.loadFile('index.html');
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => app.quit());
"@
          Set-Content -Path electron-app/main.js -Value $mainjs -Encoding utf8
          
          $html = @"
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>FireRed</title></head>
          <body style="background:#1a1a2e;color:white;font-family:sans-serif">
          <h1>FireRed OpenStoryline</h1>
          <p>AI视频编辑工具 - Apache 2.0</p>
          </body>
          </html>
"@
          Set-Content -Path electron-app/index.html -Value $html -Encoding utf8

      - name: Build EXE
        run: |
          cd electron-app
          npm install -g electron-builder
          npx electron-builder --win portable

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: firered-windows-exe
          path: electron-app/dist/*.exe
