name: Build FireRed

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Project
        run: |
          cordova create app com.firered.app "FireRed"
          cd app
          cordova platform add android

      - name: Create Web Content
        run: |
          cat > app/www/index.html << 'HTML'
<!DOCTYPE html>
<html>
<head>
    <title>FireRed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: linear-gradient(135deg, #FF6B6B, #FF8E53); color: white; text-align: center; padding: 50px; font-family: sans-serif; }
        h1 { font-size: 2.5em; }
        .logo { font-size: 4em; }
    </style>
</head>
<body>
    <div class="logo">🎬</div>
    <h1>FireRed OpenStoryline</h1>
    <p>AI视频编辑工具</p>
    <p>服务器: http://192.144.234.213:7860</p>
</body>
</html>
HTML

      - name: Build APK
        run: |
          cd app
          cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: firered-apk
          path: app/platforms/android/app/build/outputs/apk/release/*.apk

  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          mkdir electron-app
          cd electron-app
          npm init -y
          npm install electron@28.0.0 electron-builder@24.9.1 --save-dev

      - name: Create Files
        run: |
          echo "const {app,BrowserWindow}=require('electron');function createWindow(){const w=new BrowserWindow({width:800,height:600});w.loadURL('http://192.144.234.213:7860');}app.whenReady().then(createWindow);" > electron-app/main.js
          
          $content = @'
{
  "name": "firered",
  "version": "1.0.0",
  "main": "main.js",
  "scripts": {"dist": "electron-builder --win"},
  "build": {"appId": "com.firered.app", "win": {"target": "portable"}}
}
'@
          Set-Content -Path electron-app/package.json -Value $content -Encoding UTF8

      - name: Build EXE
        run: |
          cd electron-app
          npm run dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: firered-exe
          path: electron-app/dist/*.exe
