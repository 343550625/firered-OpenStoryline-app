name: Build FireRed

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Project
        run: cordova create app com.firered.app "FireRed"

      - name: Add Platform
        run: cd app && cordova platform add android

      - name: Create Web Content
        run: |
          cat > app/www/index.html << 'HTMLEOF'
<!DOCTYPE html>
<html>
<head>
    <title>FireRed</title>
    <style>
        body { background: linear-gradient(135deg, #FF6B6B, #FF8E53); color: white; text-align: center; padding: 50px; }
        h1 { font-size: 2.5em; }
    </style>
</head>
<body>
    <h1>FireRed OpenStoryline</h1>
    <p>AI视频编辑工具</p>
</body>
</html>
HTMLEOF

      - name: Build APK
        run: cd app && cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: firered-apk
          path: app/platforms/android/app/build/outputs/apk/release/*.apk
